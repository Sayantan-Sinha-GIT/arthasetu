name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test
      NEXT_PUBLIC_FIREBASE_API_KEY: "ci-dummy-api-key"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "arthasetu-ci.firebaseapp.com"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "arthasetu-ci"
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "arthasetu-ci.appspot.com"
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456789"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:123456789:web:abcdef"
      NEXT_PUBLIC_ADMIN_ROUTE_KEY: "4632"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Route types such as LayoutProps are generated by Next.js, not committed.
      # Without this step a clean checkout fails the typecheck before any build.
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm test

      - name: Build Next.js app
        run: npm run build
